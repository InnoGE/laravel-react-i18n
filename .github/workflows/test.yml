name: Testing

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run types:check
      - run: npm run build

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
        react: [19]
        include:
          - node-version: 22.x
            react: 18

    name: test (node ${{ matrix.node-version }}, react ${{ matrix.react }})

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - if: matrix.react == 18
        run: npm install --no-save --legacy-peer-deps react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npm test
      - if: matrix.react == 18
        run: npm run types:check
